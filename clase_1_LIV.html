<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Geolocalización consumiendo API</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body>
    <div class="container mt-4">
        <h1>Geolocalización consumiendo API</h1>
        <p>Ingrese el nombre de la ubicación, latitud y longitud para abrir la ubicación en Google Maps.</p>
    </div>
    <div class="container mt-4">
        <form id="formUbicacion">
            <div class="mb-3">
                <label for="nombreUbicacion" class="form-label">Nombre de la ubicación</label>
                <input type="text" class="form-control" id="nombreUbicacion" placeholder="Ingrese el nombre de la ubicación">
            </div>
            <div class="mb-3">
                <label for="latitud" class="form-label">Latitud</label>
                <input type="text" class="form-control" id="latitud" placeholder="Ingrese la latitud">
            </div>
            <div class="mb-3">
                <label for="longitud" class="form-label">Longitud</label>
                <input type="text" class="form-control" id="longitud" placeholder="Ingrese la longitud">
            </div>
            <button type="submit" class="btn btn-primary">Abrir ubicación</button>
        </form>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <script src="script.js"></script>
</body>
</html>
